<title>Thamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Figtree:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout concept: a centered iPhone-sized app shell; ivory ground, forest-green actions, pale-sage selection states. */
:root{
  --forest:#244C39; --sage:#8FAF91; --pale:#DCE8D8; --ivory:#F5F1E8; --beige:#C6B99F; --white:#FFFFFF;
  --ink:#1C3226; --muted:#6B7B70; --line:#E6E0D1; --card:#FFFDF8;
  --amber:#B8661F; --amber-soft:#FBE8D0; --rose:#B4463A; --sky:#E3EBF6; --sky-ink:#3F61A0;
  --page:#E4DFD0; --shadow:0 12px 30px -14px rgba(36,76,57,.35); --shadow-s:0 4px 14px -8px rgba(36,76,57,.3);
  --f-display:'Outfit','Avenir Next','Segoe UI',sans-serif; --f-body:'Figtree','Avenir Next','Segoe UI',sans-serif; --f-ar:'Aref Ruqaa','Noto Naskh Arabic','Geeza Pro',serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
.ic{display:block;flex:none}
#stage{height:100%;display:grid;place-items:center;padding:14px}
.device{position:relative;width:min(100%,410px);height:min(100%,880px);background:linear-gradient(180deg,#FBF9F3 0%,var(--ivory) 38%);border-radius:46px;overflow:hidden;box-shadow:0 0 0 9px #1d2a23,0 40px 80px -30px rgba(20,40,30,.6)}
@media(max-width:520px){#stage{padding:0}.device{width:100%;height:100%;border-radius:0;box-shadow:none}}
#screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:20px}
#screen::-webkit-scrollbar{display:none}
#screen.has-nav{padding-bottom:104px}
#screen.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}.top{padding-top:18px}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h1{font-family:var(--f-display);font-weight:300;font-size:29px;line-height:1.18;letter-spacing:-.01em}
.h1 em{font-style:normal;color:var(--forest);font-weight:500}
.h1.sm{font-size:26px;font-weight:400}
.h2{font-family:var(--f-display);font-weight:500;font-size:17px}
.sub{color:var(--muted);font-size:13px;line-height:1.45}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font-family:var(--f-display);font-weight:500;font-size:17px}
.link{color:var(--forest);font-weight:600;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--white);box-shadow:var(--shadow-s);display:grid;place-items:center;position:relative;color:var(--forest)}
.badge{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,var(--sage),var(--forest));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:var(--shadow-s)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow-s);border:1px solid rgba(198,185,159,.28)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:27px;font-weight:600;font-size:16px;width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#2B5A44,var(--forest));color:#fff;box-shadow:0 14px 24px -12px rgba(36,76,57,.75)}
.btn.soft{background:var(--pale);color:var(--forest)}
.btn.ghost{background:transparent;border:1.5px solid var(--forest);color:var(--forest)}
.btn.sm{height:38px;font-size:13px;border-radius:19px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:18px;background:var(--white);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600}
.pill.open{background:var(--pale);color:var(--forest)}.pill.closed{background:#F4DDD8;color:var(--rose)}
.pill.s0{background:var(--sky);color:var(--sky-ink)}.pill.s1{background:var(--amber-soft);color:var(--amber)}.pill.s2{background:#EADFF3;color:#6A4A93}.pill.s3{background:var(--pale);color:var(--forest)}
.pill.high{background:var(--amber-soft);color:var(--amber)}.pill.med{background:#F6EFC8;color:#7C6A12}.pill.low{background:var(--pale);color:var(--forest)}
.pill.sample{background:#EFE9DA;color:#7E7156;font-weight:600;font-size:11px}
/* logo */
.logo{text-align:center;color:var(--forest)}
.lw{position:relative;display:inline-block;font-family:var(--f-display);font-weight:300;font-size:70px;letter-spacing:-.03em;line-height:1}
.lw .lf{position:absolute;left:.03em;top:-.34em;width:.5em;height:.5em;transform:rotate(-8deg)}
.la{font-family:var(--f-ar);font-size:46px;line-height:.9;margin-top:-2px;margin-right:-8px}
.logo.sm .lw{font-size:30px}.logo.sm .la{font-size:20px}
/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;padding:26px 28px 30px;background:radial-gradient(120% 60% at 50% 0%,#fff 0%,rgba(255,255,255,0) 70%),radial-gradient(90% 50% at 80% 60%,rgba(143,175,145,.35),transparent 70%)}
.skip{align-self:flex-end;color:var(--muted);font-size:14px;font-weight:500;padding:6px 4px}
.w-logo{margin-top:34px}
.slogan{font-family:var(--f-display);font-weight:300;font-size:22px;text-align:center;margin:22px 12px 10px;line-height:1.3;text-wrap:balance}
.intro{text-align:center;color:var(--muted);line-height:1.55;font-size:14.5px;margin:0 6px;text-wrap:balance}
.w-art{flex:1;min-height:200px;margin:8px -10px 6px}
.w-art svg{width:100%;height:100%}
.foot-note{text-align:center;margin-top:16px;color:var(--muted)}
.foot-note button{color:var(--forest);font-weight:700}
/* forms */
.field{margin-top:14px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.inp{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;height:50px}
.inp:focus-within{border-color:var(--forest)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);height:100%;outline:none}
.inp .ic{color:var(--muted)}
.err{margin-top:12px;color:var(--rose);font-size:13px;font-weight:600}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.role{position:relative;background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:14px 13px 14px;display:flex;flex-direction:column;gap:6px;transition:all .15s;min-height:138px}
.role .ri{width:40px;height:40px;border-radius:13px;background:var(--pale);display:grid;place-items:center;color:var(--forest)}
.role b{font-family:var(--f-display);font-weight:500;font-size:16px}
.role span.d{font-size:12px;color:var(--muted);line-height:1.35}
.role .tick{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--forest);color:#fff;display:none;place-items:center}
.role.on{border-color:var(--forest);background:var(--pale);box-shadow:0 8px 18px -12px rgba(36,76,57,.6)}
.role.on .ri{background:var(--forest);color:#fff}.role.on .tick{display:grid}
/* header search/quick */
.loc{display:flex;align-items:center;gap:6px;background:var(--white);padding:8px 12px;border-radius:20px;box-shadow:var(--shadow-s);font-weight:600;font-size:13.5px}
.loc .ic{color:var(--forest)}
.search{display:flex;align-items:center;gap:10px;margin-top:16px;background:var(--white);border-radius:22px;height:52px;padding:0 10px 0 16px;box-shadow:var(--shadow-s);color:var(--muted);width:100%}
.search .grow{flex:1;font-size:14px}
.search .sc{width:34px;height:34px;border-radius:12px;background:var(--pale);color:var(--forest);display:grid;place-items:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;background:var(--white);border-radius:20px;box-shadow:var(--shadow-s);font-size:12px;font-weight:500;text-align:center}
.qa i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.insight{display:flex;gap:12px;align-items:flex-start;padding:15px;margin-top:16px}
.insight .lg{width:42px;height:42px;flex:none;border-radius:14px;background:var(--pale);color:var(--forest);display:grid;place-items:center}
.insight .t{font-size:13.5px;line-height:1.4;margin-top:2px}
.insight .btn{margin-top:10px}
.impact{padding:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--ivory);border-radius:16px;padding:12px 6px;text-align:center}
.tile .ic{margin:0 auto 6px;color:var(--forest)}
.tile b{display:block;font-family:var(--f-display);font-weight:500;font-size:21px;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted)}
.mapcard{overflow:hidden;position:relative;padding:0}
.mapcard .cap{display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:12.5px;font-weight:600;color:var(--forest)}
.mapcard svg{display:block;width:100%;height:auto}
.mini{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:12px;background:rgba(255,253,248,.95);border-radius:18px;padding:9px;box-shadow:var(--shadow)}
.mini b{display:block;font-size:13.5px}.mini span{font-size:12px;color:var(--muted)}
.mini .ch{margin-left:auto;color:var(--forest)}
/* art */
.th{width:62px;height:62px;border-radius:16px;overflow:hidden;flex:none}
.th svg,.hero svg{width:100%;height:100%;display:block}
.frow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:var(--card);box-shadow:var(--shadow-s);margin-bottom:10px;width:100%}
.frow .m{flex:1;min-width:0}
.frow b{display:block;font-weight:600;font-size:14.5px}
.frow .s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.frow .ch{color:var(--muted)}
/* food detail */
.hero{position:relative;height:340px}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(180deg,transparent,var(--ivory))}
.hero.fr::after{display:none}
.hbar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:3}
.hbar .r{display:flex;gap:8px}
.ghostb{width:40px;height:40px;border-radius:50%;background:rgba(255,253,248,.88);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--ink)}
.ghostb.fav{color:var(--rose)}
.ai-tag{display:inline-flex;align-items:center;gap:6px;background:var(--white);padding:7px 12px;border-radius:16px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-s)}
.ai-tag .ic{color:var(--forest)}
.fd{margin-top:-82px;position:relative;z-index:2}
.fd h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:10px 0 2px;letter-spacing:-.01em}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.st{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 9px;min-width:0}
.st i{width:30px;height:30px;border-radius:50%;background:var(--pale);color:var(--forest);display:grid;place-items:center;flex:none}
.st b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}.st span{font-size:11px;color:var(--muted)}
.alert{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;margin-top:14px;font-weight:500;line-height:1.35}
.alert.high{background:var(--amber-soft);color:var(--amber)}.alert.med{background:#F6EFC8;color:#6E5E0E}.alert.low{background:var(--pale);color:var(--forest)}
.rec{display:flex;gap:12px;align-items:center;padding:14px;margin-top:12px;width:100%}
.rec .lg{width:38px;height:38px;border-radius:12px;background:var(--pale);color:var(--forest);display:grid;place-items:center;flex:none}
.rec b{font-size:14px}.rec span{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.details{padding:6px 16px;margin-top:16px}
.drow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.drow:last-child{border:0}
.drow .ic{color:var(--muted)}.drow span{width:84px;color:var(--muted);font-size:13px}.drow b{font-weight:500;flex:1;font-size:13.5px}
.footbar{position:sticky;bottom:0;padding:14px 20px 18px;background:linear-gradient(180deg,rgba(245,241,232,0),var(--ivory) 38%);z-index:5;display:flex;gap:10px}
/* fridge */
.fcard{margin-top:-30px;position:relative;z-index:2;background:var(--ivory);border-radius:30px 30px 0 0;padding:20px 20px 0}
.fcard h1{font-family:var(--f-display);font-weight:400;font-size:25px;margin:0;letter-spacing:-.01em}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:6px}
.meta .ic{color:var(--forest)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.act{background:var(--white);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;box-shadow:var(--shadow-s)}
.act .ic{color:var(--forest)}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin:18px 0 14px}
.tab{flex:1;text-align:center;padding:10px 0;color:var(--muted);font-size:14px;position:relative}
.tab.on{color:var(--forest);font-weight:700}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1.5px;height:2.5px;background:var(--forest);border-radius:2px}
.seg{display:flex;background:#ECE6D6;border-radius:16px;padding:4px;margin-top:14px}
.seg button{flex:1;text-align:center;padding:9px 4px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--forest);box-shadow:var(--shadow-s)}
.tl{position:relative;padding-left:26px}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px var(--pale)}
.tl::before{content:"";position:absolute;left:-14px;top:8px;bottom:12px;width:2px;background:var(--line)}
.tl{margin-left:14px}
.ev b{font-size:13.5px;font-weight:600}.ev span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
/* map */
.map-wrap{margin:14px 16px 0;border-radius:26px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.map-wrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.selcard{margin:12px 16px 0;padding:14px;display:flex;gap:12px;align-items:center}
.selcard .m{flex:1;min-width:0}.selcard b{display:block;font-size:14.5px}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:12px}
.pp{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative}
.pp i{width:24px;height:24px;border-radius:50%;background:#ECE6D6;color:var(--muted);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;position:relative;z-index:1}
.pp b{font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pp::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#ECE6D6}
.pp:first-child::before{display:none}
.pp.done i{background:var(--forest);color:#fff}.pp.done::before{background:var(--forest)}.pp.done b{color:var(--forest)}
.pp.now i{background:var(--white);border:2px solid var(--forest);color:var(--forest)}.pp.now b{color:var(--forest)}
.track{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px}
.tk{text-align:center;font-size:11.5px;color:var(--muted);position:relative;padding-top:24px;font-weight:600}
.tk::before{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:#ECE6D6}
.tk:first-child::before{display:none}
.tk::after{content:"";position:absolute;top:0;left:calc(50% - 8px);width:16px;height:16px;border-radius:50%;background:#ECE6D6;border:3px solid var(--ivory)}
.tk.done{color:var(--forest)}.tk.done::before,.tk.done::after{background:var(--forest)}
.tk.now::after{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
/* scanner */
.cam{position:relative;margin:12px 20px 0;aspect-ratio:1/1.02;border-radius:30px;overflow:hidden;background:#13221A}
.cam .feed{position:absolute;inset:10%;border-radius:22px;overflow:hidden;opacity:.92}
.cam .feed svg{width:100%;height:100%}
.cam .vf{position:absolute;inset:7%;pointer-events:none}
.cam .vf i{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.cam .beam{position:absolute;left:7%;right:7%;height:3px;background:linear-gradient(90deg,transparent,#B8E2B8,transparent);box-shadow:0 0 18px 4px rgba(143,175,145,.9);top:8%;animation:beam 1.3s ease-in-out infinite alternate;display:none}
.cam.scanning .beam{display:block}
@keyframes beam{to{top:90%}}
.cam .status{position:absolute;left:0;right:0;bottom:12px;text-align:center}
.cam .status span{display:inline-block;background:rgba(19,34,26,.78);color:#fff;border-radius:16px;padding:7px 14px;font-size:13px;font-weight:500}
.cam .cbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3}
.cam .ghostb{background:rgba(255,255,255,.18);color:#fff}
.samples{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
.samples::-webkit-scrollbar{display:none}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--forest);display:grid;place-items:center;margin:14px auto 0}
.shutter i{width:56px;height:56px;border-radius:50%;background:var(--forest);display:grid;place-items:center;color:#fff}
.res{padding:16px;margin:14px 20px 0}
.conf{height:6px;border-radius:3px;background:#ECE6D6;overflow:hidden;margin-top:6px}.conf i{display:block;height:100%;background:var(--sage)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* activity */
.stepper{display:flex;gap:6px;margin:10px 0 4px}.stepper i{flex:1;height:5px;border-radius:3px;background:#E3DDCC}.stepper i.on{background:var(--forest)}
.pick{display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);margin-bottom:10px;width:100%}
.pick.on{border-color:var(--forest);background:var(--pale)}
.pick .m{flex:1;min-width:0}.pick b{display:block;font-size:14.5px;font-weight:600}
.score{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--forest);text-align:right}.score small{display:block;font-size:10px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.qty{display:flex;align-items:center;gap:14px}.qty button{width:38px;height:38px;border-radius:50%;background:var(--white);box-shadow:var(--shadow-s);display:grid;place-items:center;color:var(--forest)}
.qty b{font-family:var(--f-display);font-size:22px;min-width:60px;text-align:center;font-weight:500}
.empty{text-align:center;padding:34px 16px;color:var(--muted);line-height:1.5}
.empty .ic{margin:0 auto 10px;color:var(--sage)}
.nrow{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--card);margin-bottom:10px;box-shadow:var(--shadow-s);position:relative;width:100%}
.nrow.unread::after{content:"";position:absolute;top:16px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.nrow .lg{width:38px;height:38px;border-radius:12px;background:var(--pale);color:var(--forest);display:grid;place-items:center;flex:none}
.nrow b{font-size:13.5px;font-weight:600;display:block;padding-right:16px;line-height:1.35}.nrow span{font-size:12px;color:var(--muted)}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0}
.prof .avatar{width:84px;height:84px;font-size:28px}
.rolebadge{display:flex;gap:12px;align-items:center;padding:14px;margin-top:16px}
.rolebadge .ri{width:46px;height:46px;border-radius:15px;background:var(--forest);color:#fff;display:grid;place-items:center;flex:none}
.set{padding:4px 16px;margin-top:14px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);width:100%}.srow:last-child{border:0}
.sw{width:46px;height:27px;border-radius:14px;background:#D7D1C0;position:relative;transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--forest)}.sw.on::after{left:22px}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(255,253,248,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);align-items:end;padding:0 6px 12px;z-index:20}
#nav.show{display:grid}
.nav-i{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A988E;padding:10px 0 2px}
.nav-i b{font-size:10.5px;font-weight:600}
.nav-i.on{color:var(--forest)}
.nav-fab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);margin-top:-26px}
.nav-fab span{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#2F6049,var(--forest));color:#fff;display:grid;place-items:center;box-shadow:0 12px 20px -8px rgba(36,76,57,.8);border:4px solid var(--ivory)}
.nav-fab b{font-size:10.5px;font-weight:600}
/* overlays */
#overlay{position:absolute;inset:0;z-index:40;display:none;background:rgba(20,34,26,.45);align-items:flex-end}
#overlay.show{display:flex}
.sheet{width:100%;background:var(--ivory);border-radius:28px 28px 0 0;padding:10px 20px 26px;max-height:82%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--beige);margin:0 auto 14px;opacity:.7}
.opt{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;font-weight:500}
.opt:last-child{border:0}
#toast{position:absolute;left:20px;right:20px;top:18px;z-index:60;pointer-events:none;display:flex;justify-content:center}
#toast div{background:var(--forest);color:#fff;border-radius:18px;padding:11px 16px;font-weight:500;font-size:13.5px;box-shadow:var(--shadow);animation:rise .3s both;display:flex;gap:8px;align-items:center;max-width:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"><div class="device">
  <div id="screen"></div>
  <nav id="nav" aria-label="Main"></nav>
  <div id="overlay"></div>
  <div id="toast"></div>

var MAIN={home:1,map:1,activity:1,profile:1};
function navHTML(){return [['home','Home','home'],['map','Map','pin'],['donate','Donate','plus'],['activity','Activity','activity'],['profile','Profile','user']].map(function(i){return i[0]==='donate'?'<button class="nav-fab" data-act="startDonate"><span>'+ic('plus',26,2.2)+'</span><b>Donate</b></button>':'<button class="nav-i '+(S.screen===i[0]?'on':'')+'" data-act="tab" data-t="'+i[0]+'">'+ic(i[2],23)+'<b>'+i[1]+'</b></button>'}).join('')}
function render(){var el=$('#screen'),keep=S._last===S.screen?el.scrollTop:0;var v=V[S.screen]||V.home;el.innerHTML=v();el.className=(MAIN[S.screen]?'has-nav ':'')+(el.classList.contains('enter')?'enter':'');el.scrollTop=keep;S._last=S.screen;
 var nv=$('#nav');if(MAIN[S.screen]){nv.className='show';nv.innerHTML=navHTML()}else{nv.className='';nv.innerHTML=''}}
function anim(){var el=$('#screen');el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');el.scrollTop=0;S._last=null;clearTimeout(anim.h);anim.h=setTimeout(function(){el.classList.remove('enter')},480)}
function go(s,o){S.stack.push(S.screen);S.screen=s;if(o)for(var k in o)S[k]=o[k];anim();render();$('#screen').scrollTop=0}
function back(){var p=S.stack.pop();S.screen=p||'home';anim();render()}
function reset(s){S.stack=[];S.screen=s;anim();render()}
function newDraft(o){return Object.assign({name:'',cat:'Cooked Meals',qty:1,unit:'portions',useBy:fd(1),storage:STOR[0],cond:'Good',allergens:[]},o||{})}
function beginDonate(id){var f=S.inv.filter(function(x){return x.id===id})[0]||null;if(!f){var rs=atRisk();f=rs[0]||S.inv[0]||null}
 S.donate={step:1,itemId:f?f.id:null,qty:f?Math.min(f.qty,Math.max(1,Math.ceil(f.qty/2))):1,win:'3–5 PM',destId:f?matches(f)[0].id:null};S.donate.qty=f?f.qty:1;go('donate')}
function advance(id){var d=S.don.filter(function(x){return x.id===id})[0];if(!d||d.status>=3)return;d.status++;
 if(d.status===1){d.vol=S.role==='volunteer'?(S.user.name||'You'):(d.vol||'Noura A.');notify(d.vol+' picked up '+d.name+'.','truck')}
 if(d.status===2)notify(d.name+' is on the way to '+d.dest.name+'.','truck');
 if(d.status===3){var I=S.impact;I.meals+=d.qty;I.people+=Math.max(2,Math.round(d.qty*1.5));I.co2+=Math.max(1,Math.round(d.qty*.6));I.deliv+=1;I.recv+=1;
  if(d.dest.fid){var fr=fridgeById(d.dest.fid);if(fr){fr.stock.push(mk({name:d.name,cat:d.cat,qty:d.qty,unit:d.unit,useBy:fd(2),art:d.art}));fr.log.unshift([d.name+' delivered','Just now · via Thamer'])}}
  notify(d.name+' was delivered. Impact updated.','check');toast('Delivered. Thamer learned from this donation.');render();return}
 toast('Status updated: '+STATUS[d.status]);render()}

/* ---------- events ---------- */
var H={
 start:function(){S.reg.err='';go('register')},
 goLogin:function(){S.login.err='';go('login')},
 back:function(){back()},
 role:function(d){S.role=d.r;render()},
 togglePw:function(d){var m={show:'reg',show2:'reg',lshow:'login'};if(d.f==='lshow')S.login.show=!S.login.show;else S.reg[d.f]=!S.reg[d.f];render()},
 createAccount:function(){var R=S.reg,e;if(!R.name.trim())e='Please enter your full name.';else if(!/^\S+@\S+\.\S+$/.test(R.email))e='Please enter a valid email address.';else if(R.pw.length<6)e='Password must be at least 6 characters.';else if(R.pw!==R.pw2)e='Passwords do not match.';
  if(e){R.err=e;render();return}R.err='';S.user={name:R.name.trim(),email:R.email.trim()};notify('Welcome to Thamer, '+S.user.name.split(' ')[0]+'. Your '+ROLES[S.role].name+' account is ready.','leaf');reset('home');toast('Account created as '+ROLES[S.role].name)},
 doLogin:function(){var L=S.login,e;if(!/^\S+@\S+\.\S+$/.test(L.email))e='Please enter a valid email address.';else if(L.pw.length<6)e='Password must be at least 6 characters.';
  if(e){L.err=e;render();return}if(!S.user.name){var n=L.email.split('@')[0].replace(/[._-]+/g,' ');S.user={name:n.replace(/\b\w/g,function(c){return c.toUpperCase()}),email:L.email}}else S.user.email=L.email;reset('home');toast('Signed in as '+ROLES[S.role].name)},
 tab:function(d){S.mapSel=d.t==='map'?S.mapSel:S.mapSel;reset(d.t)},
 go:function(d){go(d.s)},
 areaSheet:function(){sheet('<div class="h2" style="margin-bottom:6px">Choose area</div>'+['Riyadh','Riyadh · PSU Campus','Riyadh · Al Olaya','Riyadh · Al Malqa'].map(function(a){return '<button class="opt" data-act="setArea" data-a="'+a+'">'+ic('pin',20)+'<span style="flex:1">'+a+'</span>'+(S.area===a?ic('check',18,2.4):'')+'</button>'}).join(''))},
 setArea:function(d){S.area=d.a;closeSheet();render()},
 period:function(){S.period=S.period==='week'?'month':'week';render()},
 scanFood:function(){S.scan={phase:'idle',sample:S.scan.sample,item:null,msg:''};go('scanner')},
 pickSample:function(d){S.scan.sample=+d.i;render()},
 scanStart:function(){var msgs=['Detecting food…','Estimating freshness…','Checking allergens…','Predicting surplus risk…'],i=0;S.scan.phase='scanning';S.scan.msg=msgs[0];render();
  clearInterval(H._t);H._t=setInterval(function(){i++;if(S.screen!=='scanner'||S.scan.phase!=='scanning'){clearInterval(H._t);return}
   if(i>=msgs.length){clearInterval(H._t);var s=SAMPLES[S.scan.sample];S.scan.item={name:s.name,cat:s.cat,qty:s.qty,unit:s.unit,useBy:fd(s.days),cond:s.cond,storage:s.storage,allergens:s.allergens.slice(),conf:s.conf};S.scan.phase='result';render();return}
   S.scan.msg=msgs[i];var st=$('.cam .status span');if(st)st.textContent=msgs[i]},650)},
 scanAgain:function(){S.scan.phase='idle';S.scan.sample=(S.scan.sample+1)%SAMPLES.length;render()},
 algScan:function(d){var a=S.scan.item.allergens,i=a.indexOf(d.a);if(i>-1)a.splice(i,1);else a.push(d.a);render()},
 scanAdd:function(){var f=mk(Object.assign({},S.scan.item,{ai:true}));S.inv.unshift(f);toast('Added to inventory');S.scan.phase='idle';S.sel={id:f.id,src:'inv'};S.stack.pop();S.screen='food';anim();render()},
 scanDonate:function(){var f=mk(Object.assign({},S.scan.item,{ai:true}));S.inv.unshift(f);S.scan.phase='idle';S.stack.pop();beginDonate(f.id)},
 addFood:function(){S.draft=newDraft();S.draftErr='';go('addfood')},
 alg:function(d){var a=S.draft.allergens,i=a.indexOf(d.a);if(i>-1)a.splice(i,1);else a.push(d.a);render()},
 saveFood:function(){var d=S.draft;if(!d.name.trim()){S.draftErr='Please enter a food name.';render();return}if(!(d.qty>0)){S.draftErr='Quantity must be at least 1.';render();return}S.draftErr='';
  var f;if(d.id){f=S.inv.filter(function(x){return x.id===d.id})[0];Object.assign(f,d);f.art=artFor(f)}else{f=mk(d);S.inv.unshift(f);var r=risk(f);notify('AI prediction for '+f.name+': '+r.t.toLowerCase()+'.','down2')}
  toast(d.id?'Changes saved':'Added to inventory');S.sel={id:f.id,src:'inv'};var fromD=S.stack[S.stack.length-1]==='donate';S.stack.pop();if(fromD&&S.donate){S.screen='donate';S.donate.itemId=f.id;S.donate.qty=f.qty;S.donate.destId=matches(f)[0].id;S.donate.step=1}else S.screen='food';anim();render()},
 openFood:function(d){S.sel={id:d.id,src:d.src};go('food')},
 fav:function(){var f=getFood(S.sel);f.fav=!f.fav;toast(f.fav?'Saved to favourites':'Removed from favourites');render()},
 foodMore:function(){var f=getFood(S.sel);sheet('<div class="h2" style="margin-bottom:6px">'+esc(f.name)+'</div><button class="opt" data-act="editFood">'+ic('tag',20)+'Edit details</button><button class="opt" data-act="startDonate" data-id="'+f.id+'">'+ic('heart',20)+'Create donation</button><button class="opt" data-act="delFood" style="color:var(--rose)">'+ic('x',20)+'Remove from inventory</button>')},
 editFood:function(){var f=getFood(S.sel);closeSheet();S.draft=JSON.parse(JSON.stringify(f));S.draftErr='';go('addfood')},
 delFood:function(){var id=S.sel.id;S.inv=S.inv.filter(function(x){return x.id!==id});closeSheet();toast('Removed from inventory');back()},
 startDonate:function(d){closeSheet();beginDonate(d&&d.id)},
 dback:function(){if(S.donate.step>1){S.donate.step--;render()}else back()},
 dnext:function(){var D=S.donate;if(D.step===1){var it=S.inv.filter(function(f){return f.id===D.itemId})[0];if(!it)return;D.destId=matches(it)[0].id}D.step++;render();$('#screen').scrollTop=0},
 pickItem:function(d){var f=S.inv.filter(function(x){return x.id===d.id})[0];S.donate.itemId=d.id;S.donate.qty=f.qty;render()},
 dq:function(d){var D=S.donate,f=S.inv.filter(function(x){return x.id===D.itemId})[0];D.qty=Math.max(1,Math.min(f.qty,D.qty+(+d.d)));render()},
 pwin:function(d){S.donate.win=d.w;render()},
 pickDest:function(d){S.donate.destId=d.id;render()},
 confirmDon:function(){var D=S.donate,it=S.inv.filter(function(f){return f.id===D.itemId})[0],dm=matches(it).filter(function(r){return r.id===D.destId})[0]||matches(it)[0];
  var dest={id:dm.id,name:dm.name,type:'x'};if(dm.id==='fr_kac'){dest.fid='kac'}
  var d={id:'d'+(Date.now()%100000),name:it.name,art:it.art,qty:D.qty,unit:it.unit,cat:it.cat,dest:dest,status:0,vol:null,when:'Just now',win:D.win};S.don.unshift(d);
  it.qty-=D.qty;if(it.qty<=0)S.inv=S.inv.filter(function(f){return f.id!==it.id});
  notify('Donation created: '+d.name+' matched with '+dm.name+'.','heart');S.dsel=d.id;S.donate=null;S.stack=['activity'];S.screen='donation';S.atab='donations';anim();render();toast('Donation created and matched')},
 openDon:function(d){S.dsel=d.id;go('donation')},
 advance:function(d){advance(d.id)},
 openFridge:function(d){closeSheet();S.fridgeId=d.id;S.ftab='food';go('fridge')},
 ftab:function(d){S.ftab=d.t;render()},
 viewMap:function(d){S.mapSel=d.id;S.mapFilter='all';reset('map')},
 directions:function(){toast('Route to '+fridgeById(S.fridgeId).name+' ready: '+fridgeById(S.fridgeId).dist+' km')},
 share:function(){var f=fridgeById(S.fridgeId);var link='thamer.app/fridge/'+f.id;sheet('<div class="h2" style="margin-bottom:6px">Share '+esc(f.name)+'</div><div class="inp" style="margin:12px 0">'+ic('leaf',18)+'<input value="'+link+'" readonly id="lnk"></div><button class="btn primary" data-act="copyLink" data-l="'+link+'">'+ic('copy',18)+'Copy link</button>')},
 copyLink:function(d){var done=function(){closeSheet();toast('Link copied')};try{navigator.clipboard.writeText(d.l).then(done,function(){var i=$('#lnk');i.select();done()})}catch(e){var i=$('#lnk');if(i)i.select();done()}},
 pin:function(d){S.mapSel=d.id;if(S.screen!=='map'){S.mapFilter='all';reset('map')}else render()},
 mapF:function(d){S.mapFilter=d.f;render()},
 dpSheet:function(d){var p=ptById(d.id),k=S.role;var act=k==='recipient'?['reqFood','Request this food']:k==='volunteer'?['acceptPick','Accept pickup']:['closeSheet','Close'];
  sheet('<div class="frow" style="box-shadow:none;padding:0;background:none">'+thumb(p.art)+'<div class="m"><b>'+esc(p.name)+'</b><div class="s">'+esc(p.desc)+'</div><div class="s">'+ic('pin',13)+p.dist+' km from PSU Campus</div></div></div><button class="btn primary" style="margin-top:14px" data-act="'+act[0]+'" data-id="'+p.id+'">'+act[1]+'</button>')},
 closeSheet:function(){closeSheet()},
 reqFood:function(d){var p=ptById(d.id);closeSheet();notify('Request sent to '+p.name+'.','utensils');toast('Request sent to '+p.name);render()},
 acceptPick:function(d){var p=ptById(d.id);closeSheet();var dn={id:'d'+(Date.now()%100000),name:p.desc.split(' · ')[0],art:p.art,qty:parseInt(p.desc.replace(/\D+/g,' ').trim().split(' ').pop(),10)||6,unit:'portions',cat:'Cooked Meals',dest:{id:'r4',name:'PSU Student Pantry',type:'x'},status:1,vol:S.user.name||'You',when:'Just now',win:'Now'};S.don.unshift(dn);notify('You accepted a pickup from '+p.name+'.','truck');toast('Pickup accepted');S.dsel=dn.id;go('donation')},
 reserve:function(d){var f=getFood(S.sel),fr=S.fridges.filter(function(x){return x.stock.indexOf(f)>-1})[0];if(f.qty<1)return;f.qty-=1;S.resv.unshift({name:f.name,art:f.art,from:fr?fr.name:'Community fridge'});if(f.qty<=0&&fr)fr.stock=fr.stock.filter(function(x){return x!==f});if(fr)fr.log.unshift(['1 '+f.name+' reserved','Just now · by you']);S.impact.recv+=1;notify('Reserved 1 × '+f.name+' at '+(fr?fr.name:'the fridge')+'.','utensils');toast('Reserved. Find it in Activity');if(f.qty<=0)back();else render()},
 collect:function(){var f=getFood(S.sel),fr=S.fridges.filter(function(x){return x.stock.indexOf(f)>-1})[0];fr.stock=fr.stock.filter(function(x){return x!==f});fr.log.unshift([f.name+' collected for redistribution','Just now · by you']);var dn={id:'d'+(Date.now()%100000),name:f.name,art:f.art,qty:f.qty,unit:f.unit,cat:f.cat,dest:{id:'r1',name:'Al Amal Family Support',type:'x'},status:1,vol:S.user.name||'You',when:'Just now',win:'Now'};S.don.unshift(dn);notify('You collected '+f.name+' for Al Amal Family Support.','truck');toast('Collected. Delivery task created');S.dsel=dn.id;S.stack.pop();S.screen='donation';anim();render()},
 similar:function(){var f=getFood(S.sel);S.draft=newDraft({name:f.name,cat:f.cat,unit:f.unit,qty:f.qty});S.draftErr='';go('addfood')},
 removeFr:function(){var f=getFood(S.sel),fr=S.fridges.filter(function(x){return x.stock.indexOf(f)>-1})[0];fr.stock=fr.stock.filter(function(x){return x!==f});fr.log.unshift([f.name+' removed by admin','Just now']);toast('Removed from '+fr.name);back()},
 recSheet:function(){sheet('<div class="h2">Fridge activity insight</div><p class="sub" style="margin:8px 0 14px">Based on the last 7 days, items like this are usually claimed within 3 hours of restocking. This is simulated prototype data.</p><button class="btn primary" data-act="closeSheet">Got it</button>')},
 atab:function(d){S.atab=d.t;render()},
 approve:function(d,el){var a=S.appr.filter(function(x){return x.id===d.id})[0];S.appr=S.appr.filter(function(x){return x.id!==d.id});var ok=!!(el&&el.dataset.ok);notify((ok?'Approved: ':'Declined: ')+a.t,ok?'check':'x');toast(ok?'Approved '+a.t:'Declined '+a.t);render()},
 readAll:function(){S.notifs.forEach(function(n){n.u=false});render()},
 switchRole:function(d){S.role=d.r;S.atab='donations';toast('Switched to '+ROLES[d.r].name+' view');render()},
 tog:function(d){S.sets[d.k]=!S.sets[d.k];render()},
 logout:function(){S.user={name:'',email:''};S.reg={name:'',email:'',pw:'',pw2:'',show:false,show2:false,err:''};S.login={email:'',pw:'',show:false,err:''};S.inv=[];S.fridges=[];S.don=[];S.notifs=[];S.appr=[];S.resv=[];uid=100;seed();S.impact={meals:12,people:28,co2:18,deliv:9,recv:7,donors:4};reset('welcome')},
 qs:function(d){S.q=d.w;render();var i=$('#q');if(i){i.focus()}}
};
document.addEventListener('click',function(e){
 if(e.target.id==='overlay'){closeSheet();return}
 var t=e.target.closest('[data-act]');if(!t)return;var fn=H[t.dataset.act];if(fn)fn(t.dataset,t,e)});
function onInput(e){var t=e.target;
 if(t.dataset.q){S.q=t.value;var r=$('#sr');if(r)r.innerHTML=searchRes(S.q);return}
 var b=t.dataset.bind;if(!b)return;var v=t.value;if(t.dataset.num)v=Math.max(0,parseInt(v,10)||0);setPath(S,b,v);
 if(b==='scan.item.useBy'||b==='scan.item.cat'){}}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.tagName==='INPUT'){if(S.screen==='register')H.createAccount();else if(S.screen==='login')H.doLogin()}});
render();
window.__thamer={S:S,H:H,render:render};
})();
</script>
